<title>לוח משימות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&family=Assistant:wght@400;600&display=swap">
<style>
/* Layout: toolbar on top, four status columns (kanban) in the middle, handled-notes history at the bottom. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #16212b;
  --muted: #64717e;
  --line: #dde3e8;
  --accent: #0d6b7a;
  --accent-fg: #ffffff;
  --s-todo: #7b8794;
  --s-doing: #2f6fdb;
  --s-wait: #c47a0a;
  --s-live: #1f8a4c;
  --danger: #b4351f;
  --font-display: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --font-body: "Assistant", "Arial Hebrew", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181f; --surface: #1a232c; --fg: #e6ecf1; --muted: #93a1ae; --line: #2b3742;
    --accent: #4fb6c6; --accent-fg: #08262c;
    --s-todo: #9aa7b4; --s-doing: #6b9cf0; --s-wait: #e3a346; --s-live: #52c283; --danger: #f08a75;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181f; --surface: #1a232c; --fg: #e6ecf1; --muted: #93a1ae; --line: #2b3742;
  --accent: #4fb6c6; --accent-fg: #08262c;
  --s-todo: #9aa7b4; --s-doing: #6b9cf0; --s-wait: #e3a346; --s-live: #52c283; --danger: #f08a75;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.bar h1 { font-size: 22px; }
.bar .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; }
textarea { resize: vertical; min-height: 84px; }
.client-pill { font-family: var(--font-display); padding: 6px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 900px) { .board { grid-template-columns: minmax(0, 1fr); } }
.col { background: color-mix(in srgb, var(--surface) 55%, var(--bg)); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.col.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 6px; border-bottom: 3px solid var(--c); }
.col-head h2 { font-size: 15px; flex: 1; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; text-align: start; width: 100%; }
.card:hover { border-color: var(--accent); }
.card[draggable=true] { cursor: grab; }
.card .t { font-weight: 600; overflow-wrap: anywhere; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 13px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; }
.chip.open { border-color: var(--s-wait); color: var(--s-wait); font-weight: 600; }
.empty { color: var(--muted); font-size: 13px; padding: 4px; }
.add-row { display: flex; gap: 6px; }

.history, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.history h2 { font-size: 17px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 520px; }
th { text-align: start; font-size: 13px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { white-space: nowrap; }
td.done-cell { width: 70px; text-align: center; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }

.overlay { position: fixed; inset: 0; background: rgba(8, 14, 20, .55); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 24px 16px; z-index: 20; }
.modal { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; width: min(760px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.modal-head h2 { font-size: 18px; overflow-wrap: anywhere; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label { font-size: 13px; color: var(--muted); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.notice { color: var(--muted); font-size: 13px; }
.status-badge { display: inline-block; padding: 1px 10px; border-radius: 99px; color: #fff; font-size: 13px; background: var(--c); }
.hint { background: color-mix(in srgb, var(--s-wait) 14%, var(--surface)); border: 1px solid var(--s-wait); border-radius: 6px; padding: 8px 12px; font-size: 14px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .card, .col, .btn { transition: border-color .15s, background .15s; } }
</style>

<div class="wrap" dir="rtl" lang="he" id="app"><p class="empty">טוען…</p></div>

<script>
const STATUSES = [
  { key: "todo",  label: "מוכן לביצוע",       color: "var(--s-todo)" },
  { key: "doing", label: "בביצוע",            color: "var(--s-doing)" },
  { key: "wait",  label: "ממתין לאישור לקוח", color: "var(--s-wait)" },
  { key: "live",  label: "עלה לאוויר",        color: "var(--s-live)" }
];
const RESOLUTIONS = ["מחשב נייח", "נייד", "אייפון", "אנדרואיד"];

const S = { clients: [], tasks: [], notes: [], members: {}, selClient: "", openTask: null, showClients: false };
let db, user, assets, myId = null, isTeam = false, ready = false;
const $app = document.getElementById("app");

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const fmt = ts => ts ? new Date(ts).toLocaleDateString("he-IL") : "";
const byCreated = (a, b) => (a.created || 0) - (b.created || 0);
const rows = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));

function myClientId() { return isTeam ? S.selClient : (S.members[myId] || {}).clientId || ""; }
function visibleTasks() { const c = myClientId(); return S.tasks.filter(t => t.clientId === c); }
function clientName(id) { const c = S.clients.find(x => x.id === id); return c ? c.name : ""; }

async function guard(fn) {
  try { await fn(); } catch (e) { alert_("השמירה נכשלה: " + (e.message || e.code || e)); }
}
function alert_(msg) {
  const n = h("div", { class: "hint", style: "position:fixed;bottom:16px;inset-inline:16px;max-width:480px;margin:auto;z-index:40" }, msg);
  document.body.append(n); setTimeout(() => n.remove(), 4000);
}

/* ---------- main render ---------- */
function render() {
  if (!ready) return;
  const kids = [];
  const noAccess = !isTeam && !myClientId();

  const tools = h("div", { class: "tools" });
  if (isTeam) {
    const sel = h("select", { id: "client-select", "aria-label": "לקוח", style: "width:auto;min-width:160px", onchange: e => { S.selClient = e.target.value; try { localStorage.setItem("selClient", S.selClient); } catch (_) {} render(); } },
      h("option", { value: "" }, S.clients.length ? "בחרו לקוח" : "אין לקוחות עדיין"),
      S.clients.map(c => h("option", { value: c.id, selected: c.id === S.selClient }, c.name)));
    tools.append(sel, h("button", { class: "btn", onclick: () => { S.showClients = true; render(); } }, "לקוחות ומשתמשים"));
  } else if (myClientId()) {
    tools.append(h("span", { class: "client-pill" }, clientName(myClientId())));
  }
  kids.push(h("div", { class: "bar" }, h("h1", {}, "לוח משימות"), tools));

  if (noAccess) {
    kids.push(h("div", { class: "panel" }, h("h2", {}, isTeam ? "בחרו לקוח" : "המשתמש שלכם עדיין לא משויך ללקוח"),
      h("p", { class: "notice" }, isTeam ? "הוסיפו לקוח דרך ״לקוחות ומשתמשים״ ובחרו אותו מהרשימה." : "פנו לצוות הפיתוח כדי שישייך אתכם ללקוח.")));
  } else {
    const tasks = visibleTasks();
    const board = h("div", { class: "board" });
    for (const st of STATUSES) {
      const list = tasks.filter(t => t.status === st.key).sort(byCreated);
      const col = h("div", { class: "col", style: `--c:${st.color}`, "data-status": st.key },
        h("div", { class: "col-head" }, h("h2", {}, st.label), h("span", { class: "count" }, String(list.length))),
        list.length ? list.map(taskCard) : h("div", { class: "empty" }, "אין משימות"));
      if (isTeam) {
        col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
        col.addEventListener("dragleave", () => col.classList.remove("over"));
        col.addEventListener("drop", e => {
          e.preventDefault(); col.classList.remove("over");
          const id = e.dataTransfer.getData("text/plain"), t = S.tasks.find(x => x.id === id);
          if (t && t.status !== st.key) guard(() => db.doc("tasks/" + id).update({ status: st.key }));
        });
        if (st.key === "todo") col.append(addTaskRow());
      }
      board.append(col);
    }
    kids.push(board, historyPanel());
  }
  $app.replaceChildren(...kids);
  if (S.openTask) renderModal();
  if (S.showClients) renderClientsModal();
}

function taskCard(t) {
  const open = S.notes.filter(n => n.taskId === t.id && !n.handled).length;
  const c = h("div", { class: "card", tabindex: "0", role: "button", draggable: isTeam, onclick: () => { S.openTask = t.id; renderModal(); },
    onkeydown: e => { if (e.key === "Enter") { S.openTask = t.id; renderModal(); } } },
    h("span", { class: "t" }, t.title),
    h("div", { class: "meta" }, t.file ? h("span", { class: "chip" }, "קובץ מצורף") : null,
      t.status === "wait" && open ? h("span", { class: "chip open" }, open + " הערות פתוחות") : null));
  if (isTeam) c.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", t.id));
  return c;
}

function addTaskRow() {
  const input = h("input", { type: "text", id: "new-task", placeholder: "משימה חדשה…", "aria-label": "שם משימה חדשה" });
  const add = () => {
    const title = input.value.trim(); if (!title) return;
    input.value = "";
    guard(() => db.collection("tasks").add({ clientId: S.selClient, title, desc: "", status: "todo", file: null, created: Date.now() }));
  };
  input.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  return h("div", { class: "add-row" }, input, h("button", { class: "btn primary", onclick: add }, "הוסף"));
}

function historyPanel() {
  const ids = new Set(visibleTasks().map(t => t.id));
  const done = S.notes.filter(n => n.handled && ids.has(n.taskId)).sort((a, b) => (b.handledAt || 0) - (a.handledAt || 0));
  const title = id => (S.tasks.find(t => t.id === id) || {}).title || "";
  return h("section", { class: "history" }, h("h2", {}, "היסטוריית הערות שטופלו"),
    done.length ? h("div", { class: "tablewrap" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "משימה"), h("th", {}, "תיאור"), h("th", {}, "רזולוציה"), h("th", {}, "קובץ"), h("th", { class: "num" }, "תאריך טיפול"), isTeam ? h("th", {}, "") : null)),
      h("tbody", {}, done.map(n => h("tr", {}, h("td", {}, title(n.taskId)), h("td", {}, n.text), h("td", {}, n.res), h("td", {}, n.file ? h("a", { href: n.file.url, target: "_blank", rel: "noopener" }, n.file.name) : "—"), h("td", { class: "num" }, fmt(n.handledAt)),
        isTeam ? h("td", {}, h("button", { class: "btn", onclick: () => guard(() => db.doc("notes/" + n.id).update({ handled: false, handledAt: null })) }, "החזר")) : null)))))
      : h("p", { class: "notice" }, "הערות שסומנו כטופלו יופיעו כאן."));
}

/* ---------- task modal ---------- */
function closeModals() { S.openTask = null; S.showClients = false; document.querySelectorAll(".overlay").forEach(o => o.remove()); }
function overlay(content) {
  document.querySelectorAll(".overlay").forEach(o => o.remove());
  const o = h("div", { class: "overlay", onmousedown: e => { if (e.target === o) closeModals(); } }, content);
  document.body.append(o); return o;
}

function renderModal() {
  const t = S.tasks.find(x => x.id === S.openTask);
  if (!t) { closeModals(); return; }
  const st = STATUSES.find(s => s.key === t.status);
  const patch = data => guard(() => db.doc("tasks/" + t.id).update(data));

  const body = [h("div", { class: "modal-head" },
    isTeam ? h("input", { type: "text", id: "task-title", value: t.title, "aria-label": "שם המשימה", style: "font:600 18px var(--font-display)", onchange: e => e.target.value.trim() && patch({ title: e.target.value.trim() }) })
           : h("h2", {}, t.title),
    h("button", { class: "btn", onclick: closeModals }, "סגור"))];

  body.push(h("div", { class: "row" }, h("span", { class: "status-badge", style: `--c:${st.color}` }, st.label),
    isTeam ? h("select", { id: "task-status", "aria-label": "סטטוס", style: "width:auto", onchange: e => patch({ status: e.target.value }) },
      STATUSES.map(s => h("option", { value: s.key, selected: s.key === t.status }, s.label))) : null));

  body.push(h("div", { class: "field" }, h("label", { for: "task-desc" }, "תיאור"),
    isTeam ? h("textarea", { id: "task-desc", onchange: e => patch({ desc: e.target.value }) }, t.desc || "")
           : h("div", { style: "white-space:pre-wrap;overflow-wrap:anywhere" }, t.desc || "אין תיאור")));
  if (isTeam) body[body.length - 1].querySelector("textarea").value = t.desc || "";

  const fileRow = h("div", { class: "field" }, h("label", {}, "קובץ"));
  const fr = h("div", { class: "row" });
  if (t.file) fr.append(h("a", { href: t.file.url, target: "_blank", rel: "noopener" }, t.file.name));
  else if (!isTeam) fr.append(h("span", { class: "notice" }, "אין קובץ"));
  if (isTeam && assets) {
    const inp = h("input", { type: "file", id: "task-file", hidden: true, onchange: async e => {
      const f = e.target.files[0]; if (!f) return;
      try { const r = await assets.upload(f); await db.doc("tasks/" + t.id).update({ file: { id: r.id, name: f.name, url: r.url } }); }
      catch (err) { alert_("העלאת הקובץ נכשלה: " + (err.message || err.code || err)); }
    } });
    fr.append(inp, h("button", { class: "btn", onclick: () => inp.click() }, t.file ? "החלף קובץ" : "צרף קובץ"),
      t.file ? h("button", { class: "btn danger", onclick: () => patch({ file: null }) }, "הסר") : null);
  }
  fileRow.append(fr); body.push(fileRow);

  if (t.status === "wait") body.push(notesSection(t));
  if (isTeam) body.push(h("div", { class: "row" }, h("button", { class: "btn danger", id: "del-task", onclick: function () {
    if (!this.dataset.sure) { this.dataset.sure = 1; this.textContent = "לחצו שוב למחיקה"; return; }
    closeModals(); guard(() => db.doc("tasks/" + t.id).delete());
  } }, "מחק משימה")));

  const m = h("div", { class: "modal", role: "dialog", "aria-label": t.title }, body);
  const old = document.querySelector(".overlay");
  const scroll = old ? old.scrollTop : 0;
  const o = overlay(m); o.scrollTop = scroll;
}

function notesSection(t) {
  const open = S.notes.filter(n => n.taskId === t.id && !n.handled).sort(byCreated);
  const upd = (n, data) => guard(() => db.doc("notes/" + n.id).update(data));
  const sec = h("section", { class: "panel" }, h("h3", {}, "הערות לקוח"),
    h("p", { class: "hint" }, "המשימה ממתינה לאישור לקוח. הוסיפו הערות לפי מכשיר; לאחר שהצוות מסמן ״טופל״ ההערה עוברת להיסטוריה."));
  const tbody = h("tbody", {}, open.map(n => {
    const canEdit = true;
    return h("tr", {},
      h("td", {}, h("textarea", { "aria-label": "תיאור ההערה", style: "min-height:56px", onchange: e => upd(n, { text: e.target.value }) }, n.text)),
      h("td", {}, h("select", { "aria-label": "רזולוציה", onchange: e => upd(n, { res: e.target.value }) },
        RESOLUTIONS.map(r => h("option", { value: r, selected: r === n.res }, r)))),
      h("td", {}, n.file ? h("a", { href: n.file.url, target: "_blank", rel: "noopener" }, n.file.name) : h("span", { class: "notice" }, "—")),
      h("td", { class: "done-cell" }, h("input", { type: "checkbox", "aria-label": "טופל", disabled: !isTeam, title: isTeam ? "סמן כטופל" : "הצוות מסמן טופל",
        onchange: e => upd(n, { handled: e.target.checked, handledAt: e.target.checked ? Date.now() : null }) })));
  }));
  tbody.querySelectorAll("textarea").forEach((ta, i) => { ta.value = open[i].text; });
  sec.append(h("div", { class: "tablewrap" }, h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, "תיאור"), h("th", {}, "רזולוציה"), h("th", {}, "קובץ"), h("th", {}, "טופל"))),
    open.length ? tbody : h("tbody", {}, h("tr", {}, h("td", { colspan: 4, class: "notice" }, "אין הערות פתוחות"))))));

  const text = h("textarea", { id: "new-note", placeholder: "תיאור ההערה…", "aria-label": "הערה חדשה" });
  const res = h("select", { id: "new-note-res", "aria-label": "רזולוציה", style: "width:auto" }, RESOLUTIONS.map(r => h("option", { value: r }, r)));
  const file = h("input", { type: "file", id: "new-note-file", "aria-label": "צרף קובץ להערה", style: "max-width:100%" });
  sec.append(h("div", { class: "field" }, h("label", { for: "new-note" }, "הערה חדשה"), text,
    h("div", { class: "row" }, res, assets ? file : null, h("button", { class: "btn primary", onclick: async function () {
      const v = text.value.trim(); if (!v) return;
      this.disabled = true;
      let f = null;
      try {
        if (file.files[0]) { const r = await assets.upload(file.files[0]); f = { id: r.id, name: file.files[0].name, url: r.url }; }
        await db.collection("notes").add({ taskId: t.id, clientId: t.clientId, text: v, res: res.value, file: f, handled: false, created: Date.now() });
        text.value = ""; file.value = "";
      } catch (e) { alert_("השמירה נכשלה: " + (e.message || e.code || e)); }
      this.disabled = false;
    } }, "הוסף הערה"))));
  return sec;
}

/* ---------- clients & users (team only) ---------- */
async function renderClientsModal() {
  const name = h("input", { type: "text", id: "new-client", placeholder: "שם לקוח חדש", "aria-label": "שם לקוח חדש" });
  const addClient = () => { const v = name.value.trim(); if (!v) return; name.value = ""; guard(() => db.collection("clients").add({ name: v, created: Date.now() })); };
  name.addEventListener("keydown", e => { if (e.key === "Enter") addClient(); });

  const memberIds = Object.keys(S.members);
  const profiles = await user.profiles(memberIds);
  const blocks = S.clients.map(c => {
    const mine = memberIds.filter(id => S.members[id].clientId === c.id);
    const q = h("input", { type: "text", placeholder: "חיפוש משתמש לשיוך…", "aria-label": "חיפוש משתמש עבור " + c.name });
    const results = h("div", { class: "row" });
    q.addEventListener("input", async () => {
      const hits = await user.search(q.value.trim());
      results.replaceChildren(...hits.map(p => h("button", { class: "btn", onclick: () => guard(() => db.doc("members/" + p.id).set({ clientId: c.id })) }, "שייך: " + (p.name || "משתמש"))));
    });
    return h("section", { class: "panel" }, h("h3", {}, c.name),
      mine.length ? h("div", { class: "row" }, mine.map(id => h("span", { class: "chip" }, (profiles[id] && profiles[id].name) || "משתמש", " ",
        h("button", { class: "btn", style: "padding:0 6px", "aria-label": "הסר שיוך", onclick: () => guard(() => db.doc("members/" + id).delete()) }, "×"))))
        : h("p", { class: "notice" }, "אין משתמשים משויכים"), q, results);
  });
  const m = h("div", { class: "modal", role: "dialog", "aria-label": "לקוחות ומשתמשים" },
    h("div", { class: "modal-head" }, h("h2", {}, "לקוחות ומשתמשים"), h("button", { class: "btn", onclick: closeModals }, "סגור")),
    h("div", { class: "add-row" }, name, h("button", { class: "btn primary", onclick: addClient }, "הוסף לקוח")),
    blocks.length ? blocks : h("p", { class: "notice" }, "עדיין אין לקוחות."),
    h("p", { class: "notice" }, "משתמש לקוח צריך גישת Contributor לדף. אחרי השיוך הוא רואה רק את המשימות של הלקוח שלו."));
  overlay(m);
}

/* ---------- boot ---------- */
async function boot() {
  db = await claude.use("db");
  user = await claude.use("user");
  assets = await claude.use("assets");
  if (!db || !user) { $app.replaceChildren(h("p", { class: "notice" }, "צריך להתחבר כדי לראות את הלוח.")); return; }
  myId = await user.id();
  isTeam = await user.canEdit();
  try { S.selClient = localStorage.getItem("selClient") || ""; } catch (_) {}
  const sub = (path, apply) => db.collection(path).onSnapshot(s => { apply(s); ready = true; const a = document.activeElement; if (!(a && a.closest && a.closest(".modal") && /INPUT|TEXTAREA/.test(a.tagName))) render(); }, e => console.error(path, e));
  sub("clients", s => { S.clients = rows(s).sort(byCreated); if (!S.clients.find(c => c.id === S.selClient)) S.selClient = isTeam && S.clients[0] ? S.clients[0].id : ""; });
  sub("tasks", s => { S.tasks = rows(s); });
  sub("notes", s => { S.notes = rows(s); });
  sub("members", s => { S.members = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); });
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModals(); });
boot();
</script>
